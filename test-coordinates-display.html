<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经纬度信息显示测试</title>
    <script charset="utf-8" src="https://map.qq.com/api/gljs?v=1.exp&key=67PBZ-AWOWQ-TTW5A-BTI3M-BNMHH-2YBXZ"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 地图展示页面 -->
    <div id="map-page" class="page active">
        <div class="map-header">
            <h2 id="location-title">经纬度显示测试</h2>
            <p id="location-address">地址加载中...</p>

            <!-- 经纬度信息显示区域 -->
            <div id="coordinates-info" class="coordinates-info" style="display: none;">
                <div class="coordinates-container">
                    <div class="coordinate-item">
                        <span class="coordinate-label">📍 经纬度:</span>
                        <span id="coordinates-display" class="coordinate-value">加载中...</span>
                        <button id="copy-coordinates-btn" class="copy-btn" title="复制经纬度">
                            <span class="icon">📋</span>
                        </button>
                    </div>
                    <div class="coordinate-details">
                        <div class="detail-item">
                            <span class="detail-label">精度:</span>
                            <span id="accuracy-display" class="detail-value">-</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">来源:</span>
                            <span id="provider-display" class="detail-value">-</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">时间:</span>
                            <span id="time-display" class="detail-value">-</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="location-analysis" id="location-analysis" style="display: none;"></div>
        </div>

        <div id="map-container" style="height: 400px;"></div>

        <div class="action-buttons">
            <button id="refresh-btn" class="btn">
                <span class="icon">🔄</span> 刷新位置
            </button>
            <button id="test-btn" class="btn primary">
                <span class="icon">🧪</span> 测试模拟位置
            </button>
            <button id="share-btn" class="btn">
                <span class="icon">📤</span> 分享位置
            </button>
        </div>
    </div>

    <!-- Toast提示 -->
    <div id="toast" class="toast"></div>

    <!-- 加载脚本 -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/browser-detection.js"></script>
    <script src="js/location.js"></script>
    <script src="js/map.js"></script>

    <script>
        // 测试应用类
        class CoordinateTestApp {
            constructor() {
                this.currentLocation = null;
                this.locationManager = new LocationManager();
                this.mapManager = new MapManager();
                this.testCar = {
                    name: '测试车辆',
                    plate: '京TEST123',
                    color: '#007AFF'
                };
                this.init();
            }

            async init() {
                try {
                    console.log('🚀 开始初始化坐标测试应用...');

                    // 检查腾讯地图API
                    if (typeof TMap === 'undefined') {
                        throw new Error('腾讯地图API未加载');
                    }

                    // 初始化定位管理器
                    if (typeof browserDetection !== 'undefined') {
                        const tencentEnabled = this.locationManager.enableTencentLocation();
                        console.log(`🎯 腾讯定位组件: ${tencentEnabled ? '✅ 已启用' : '❌ 未启用'}`);
                    }

                    // 绑定事件
                    this.bindEvents();

                    console.log('✅ 初始化完成');
                    Utils.showToast('测试应用初始化完成，请点击按钮测试');

                } catch (error) {
                    console.error('初始化失败:', error);
                    Utils.showToast('初始化失败: ' + error.message);
                }
            }

            bindEvents() {
                // 刷新位置按钮
                const refreshBtn = document.getElementById('refresh-btn');
                if (refreshBtn) {
                    refreshBtn.addEventListener('click', () => {
                        this.getCurrentLocation();
                    });
                }

                // 测试模拟位置按钮
                const testBtn = document.getElementById('test-btn');
                if (testBtn) {
                    testBtn.addEventListener('click', () => {
                        this.testSimulatedLocation();
                    });
                }

                // 分享位置按钮
                const shareBtn = document.getElementById('share-btn');
                if (shareBtn) {
                    shareBtn.addEventListener('click', () => {
                        this.shareCoordinates();
                    });
                }

                // 复制经纬度按钮
                const copyCoordinatesBtn = document.getElementById('copy-coordinates-btn');
                if (copyCoordinatesBtn) {
                    copyCoordinatesBtn.addEventListener('click', () => {
                        this.copyCoordinates();
                    });
                }
            }

            // 获取当前位置
            async getCurrentLocation() {
                try {
                    Utils.showToast('🎯 正在获取当前位置...');

                    const location = await this.locationManager.getCurrentPosition();
                    this.currentLocation = location;

                    // 显示经纬度信息
                    this.updateCoordinatesDisplay(location);

                    // 如果地图已初始化，更新地图
                    if (this.mapManager.isMapLoaded) {
                        await this.updateMap(location);
                    } else {
                        // 初始化地图
                        await this.initializeMap(location);
                    }

                    Utils.showToast('✅ 位置获取成功');

                } catch (error) {
                    console.error('获取位置失败:', error);
                    Utils.showToast('❌ 位置获取失败: ' + error.message);
                }
            }

            // 测试模拟位置
            testSimulatedLocation() {
                // 模拟北京天安门的位置
                const simulatedLocation = {
                    lat: 39.908692,
                    lng: 116.397477,
                    accuracy: 10,
                    timestamp: Date.now(),
                    provider: '模拟定位',
                    accuracyLevel: '极高精度',
                    quality: 95
                };

                this.currentLocation = simulatedLocation;

                // 显示经纬度信息
                this.updateCoordinatesDisplay(simulatedLocation);

                // 更新地图
                if (this.mapManager.isMapLoaded) {
                    this.updateMap(simulatedLocation);
                } else {
                    this.initializeMap(simulatedLocation);
                }

                Utils.showToast('🧪 已加载模拟位置（北京天安门）');
            }

            // 初始化地图
            async initializeMap(location) {
                try {
                    const container = document.getElementById('map-container');
                    await this.mapManager.initializeMap(container, location, 15);
                    await this.updateMap(location);
                } catch (error) {
                    console.error('地图初始化失败:', error);
                    Utils.showToast('地图初始化失败: ' + error.message);
                }
            }

            // 更新地图
            async updateMap(location) {
                try {
                    this.mapManager.addMarker(location, this.testCar);

                    // 获取并显示地址
                    try {
                        const address = await this.mapManager.getAddressFromLocation(location);
                        document.getElementById('location-address').textContent = address;
                    } catch (error) {
                        document.getElementById('location-address').textContent = '地址获取失败';
                        console.warn('地址获取失败:', error);
                    }

                } catch (error) {
                    console.error('更新地图失败:', error);
                }
            }

            // 更新经纬度信息显示
            updateCoordinatesDisplay(location) {
                if (!location) {
                    return;
                }

                try {
                    // 显示经纬度信息容器
                    const coordinatesInfo = document.getElementById('coordinates-info');
                    if (coordinatesInfo) {
                        coordinatesInfo.style.display = 'block';
                    }

                    // 更新经纬度显示
                    const coordinatesDisplay = document.getElementById('coordinates-display');
                    if (coordinatesDisplay) {
                        const lat = location.lat.toFixed(6);
                        const lng = location.lng.toFixed(6);
                        coordinatesDisplay.textContent = `${lat}, ${lng}`;
                    }

                    // 更新精度信息
                    const accuracyDisplay = document.getElementById('accuracy-display');
                    if (accuracyDisplay) {
                        const accuracy = location.accuracy ? Math.round(location.accuracy) : '未知';
                        accuracyDisplay.textContent = `${accuracy}米`;
                    }

                    // 更新定位来源
                    const providerDisplay = document.getElementById('provider-display');
                    if (providerDisplay) {
                        let provider = '浏览器定位';
                        if (location.provider === 'tencent') {
                            provider = '腾讯定位';
                        } else if (location.provider === '模拟定位') {
                            provider = '模拟定位';
                        } else if (location.browserStrategy) {
                            provider = location.browserStrategy;
                        } else if (location.browserOptimized) {
                            provider = '浏览器优化';
                        }
                        providerDisplay.textContent = provider;
                    }

                    // 更新定位时间
                    const timeDisplay = document.getElementById('time-display');
                    if (timeDisplay) {
                        const time = new Date(location.timestamp || Date.now());
                        timeDisplay.textContent = Utils.formatTime(time);
                    }

                    console.log('✅ 经纬度信息更新完成:', {
                        coordinates: `${location.lat.toFixed(6)}, ${location.lng.toFixed(6)}`,
                        accuracy: location.accuracy,
                        provider: providerDisplay.textContent
                    });

                } catch (error) {
                    console.error('更新经纬度显示失败:', error);
                }
            }

            // 复制经纬度
            async copyCoordinates() {
                try {
                    if (!this.currentLocation) {
                        Utils.showToast('暂无经纬度信息');
                        return;
                    }

                    const lat = this.currentLocation.lat.toFixed(6);
                    const lng = this.currentLocation.lng.toFixed(6);
                    const accuracy = this.currentLocation.accuracy ? Math.round(this.currentLocation.accuracy) : '未知';
                    const time = Utils.formatTime(new Date(this.currentLocation.timestamp || Date.now()));

                    // 构建经纬度信息文本
                    const coordinatesText = `${this.testCar.name} 位置信息

📍 经纬度: ${lat}, ${lng}
🎯 精度: ${accuracy}米
🕐 定位时间: ${time}
🚗 车牌号: ${this.testCar.plate}

---
由车辆位置分享系统生成`;

                    const success = await Utils.copyToClipboard(coordinatesText);

                    if (success) {
                        Utils.showToast('✅ 经纬度信息已复制到剪贴板');
                    } else {
                        Utils.showToast('请手动复制经纬度信息');
                    }

                } catch (error) {
                    console.error('复制经纬度失败:', error);
                    Utils.showToast('复制经纬度失败，请手动复制');
                }
            }

            // 分享坐标
            shareCoordinates() {
                if (!this.currentLocation) {
                    Utils.showToast('请先获取位置信息');
                    return;
                }

                const lat = this.currentLocation.lat.toFixed(6);
                const lng = this.currentLocation.lng.toFixed(6);

                // 构建腾讯地图链接
                const mapUrl = `https://map.qq.com/?center=${lat},${lng}&zoom=16`;

                // 在新窗口中打开
                window.open(mapUrl, '_blank');

                Utils.showToast('已在腾讯地图中打开位置');
            }
        }

        // 启动应用
        document.addEventListener('DOMContentLoaded', () => {
            window.testApp = new CoordinateTestApp();
        });
    </script>
</body>
</html>
