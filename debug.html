<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车辆位置查询 - 调试版本</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .debug { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
        .loading { background: #e3f2fd; color: #1565c0; }
        button { padding: 10px 20px; margin: 5px; background: #007AFF; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>车辆位置系统调试工具</h1>

    <div id="debug-log" class="debug">
        <h3>调试日志：</h3>
        <div id="log-content"></div>
    </div>

    <div id="test-buttons">
        <button onclick="testLocation()">测试定位</button>
        <button onclick="testMapAPI()">测试地图API</button>
        <button onclick="testShare()">测试分享功能</button>
        <button onclick="openCarPage('car001')">打开雷克萨斯页面</button>
        <button onclick="clearLog()">清空日志</button>
    </div>

    <div id="results"></div>

    <script>
        const debugLog = document.getElementById('log-content');

        function log(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = `[${time}] ${message}`;
            debugLog.appendChild(div);
            debugLog.scrollTop = debugLog.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function testLocation() {
            log('开始测试定位功能...', 'loading');

            if (!navigator.geolocation) {
                log('❌ 浏览器不支持定位功能', 'error');
                return;
            }

            log('✅ 浏览器支持定位功能', 'success');

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    log(`✅ 定位成功！纬度: ${position.coords.latitude}, 经度: ${position.coords.longitude}`, 'success');
                    log(`定位精度: ${position.coords.accuracy}米`, 'success');
                    log(`定位时间: ${new Date(position.timestamp).toLocaleString()}`, 'success');
                },
                (error) => {
                    log(`❌ 定位失败: ${error.message}`, 'error');
                    log(`错误代码: ${error.code}`, 'error');
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        function testMapAPI() {
            log('开始测试地图API...', 'loading');

            // 检查地图API是否加载
            if (typeof TMap === 'undefined') {
                log('❌ 腾讯地图API未加载', 'error');
                return;
            }

            log('✅ 腾讯地图API已加载', 'success');

            try {
                // 创建地图实例
                const map = new TMap.Map(document.createElement('div'), {
                    center: new TMap.LatLng(39.908692, 116.397477),
                    zoom: 16
                });
                log('✅ 地图实例创建成功', 'success');

                // 测试逆地理编码
                testGeocoding();

            } catch (error) {
                log(`❌ 地图创建失败: ${error.message}`, 'error');
            }
        }

        function testGeocoding() {
            log('测试逆地理编码...', 'loading');

            const url = `https://apis.map.qq.com/ws/geocoder/v1/?location=39.908692,116.397477&key=67PBZ-AWOWQ-TTW5A-BTI3M-BNMHH-2YBXZ`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 0) {
                        log(`✅ 逆地理编码成功: ${data.result.address}`, 'success');
                    } else {
                        log(`❌ 逆地理编码失败: ${data.message}`, 'error');
                    }
                })
                .catch(error => {
                    log(`❌ 逆地理编码请求失败: ${error.message}`, 'error');
                });
        }

        function testShare() {
            log('测试分享功能...', 'loading');

            // 测试剪贴板API
            if (navigator.clipboard) {
                navigator.clipboard.writeText('测试分享文案')
                    .then(() => log('✅ 剪贴板API测试成功', 'success'))
                    .catch(error => log(`❌ 剪贴板API测试失败: ${error.message}`, 'error'));
            } else {
                log('⚠️ 剪贴板API不支持，将使用降级方案', 'error');
            }

            // 测试本地存储
            try {
                localStorage.setItem('test', 'value');
                localStorage.removeItem('test');
                log('✅ 本地存储测试成功', 'success');
            } catch (error) {
                log(`❌ 本地存储测试失败: ${error.message}`, 'error');
            }
        }

        function openCarPage(carId) {
            log(`打开车辆页面: ${carId}`, 'loading');
            const url = `index.html?car=${carId}`;

            // 在新窗口打开
            window.open(url, '_blank');
            log(`已在新窗口打开: ${url}`, 'success');
        }

        function clearLog() {
            debugLog.innerHTML = '';
        }

        // 页面加载时自动运行一些测试
        window.addEventListener('load', () => {
            log('页面加载完成，开始基础检测...', 'loading');

            // 检测浏览器信息
            log(`浏览器: ${navigator.userAgent}`, 'info');
            log(`设备类型: ${/Mobile|Android|iPhone/i.test(navigator.userAgent) ? '移动设备' : '桌面设备'}`, 'info');

            // 检测网络状态
            log(`网络状态: ${navigator.onLine ? '在线' : '离线'}`, 'info');

            // 检测HTTPS
            log(`协议: ${location.protocol}`, 'info');

            // 检测屏幕信息
            log(`屏幕分辨率: ${screen.width}x${screen.height}`, 'info');
            log(`视窗大小: ${window.innerWidth}x${window.innerHeight}`, 'info');

            log('基础检测完成', 'success');
        });
    </script>
</body>
</html>
