<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地图标记调试 v2.0</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 400px; border: 1px solid #ccc; }
        .debug-info { margin: 20px 0; padding: 15px; background: #f0f0f0; border-radius: 5px; }
        .btn { padding: 8px 16px; margin: 5px; background: #007AFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
    </style>
</head>
<body>
    <h1>地图标记调试测试</h1>

    <div class="debug-info">
        <h3>调试信息：</h3>
        <div id="debug-log"></div>
    </div>

    <button class="btn" onclick="testBasicMarker()">测试基础标记</button>
    <button class="btn" onclick="testCustomMarker()">测试自定义标记</button>
    <button class="btn" onclick="testCanvasMarker()">测试Canvas标记</button>
    <button class="btn" onclick="testCarMarker()">测试车辆标记</button>
    <button class="btn" onclick="clearMarkers()">清除所有标记</button>

    <div id="map"></div>

    <script charset="utf-8" src="https://map.qq.com/api/gljs?v=1.exp&key=67PBZ-AWOWQ-TTW5A-BTI3M-BNMHH-2YBXZ"></script>
    <script>
        const debugLog = document.getElementById('debug-log');
        let map = null;
        let markers = [];

        function log(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.innerHTML = `<strong>[${time}]</strong> ${message}`;
            if (type === 'error') div.className = 'error';
            if (type === 'success') div.className = 'success';
            debugLog.appendChild(div);
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        function initMap() {
            try {
                log('初始化地图...');
                map = new TMap.Map('map', {
                    center: new TMap.LatLng(39.908692, 116.397477),
                    zoom: 16
                });
                log('地图初始化成功', 'success');
            } catch (error) {
                log(`地图初始化失败: ${error.message}`, 'error');
            }
        }

        function testBasicMarker() {
            if (!map) {
                log('请先初始化地图', 'error');
                return;
            }

            try {
                log('创建基础标记...');
                log('注意：TMap.Marker在GL版本中不可用，使用DOMOverlay替代');

                // 创建简单的DOM标记
                const div = document.createElement('div');
                div.style.cssText = `
                    width: 30px;
                    height: 30px;
                    background: #FF6B6B;
                    border-radius: 50%;
                    border: 2px solid white;
                    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
                    cursor: pointer;
                    transform: translate(-50%, -100%);
                `;

                if (typeof TMap.DOMOverlay === 'function') {
                    const marker = new TMap.DOMOverlay({
                        map: map,
                        position: new TMap.LatLng(39.908692, 116.397477),
                        content: div
                    });
                    markers.push(marker);
                    log('基础标记创建成功（使用DOMOverlay）', 'success');
                } else {
                    log('TMap.DOMOverlay不可用', 'error');
                }
            } catch (error) {
                log(`基础标记创建失败: ${error.message}`, 'error');
            }
        }

        function testCustomMarker() {
            if (!map) {
                log('请先初始化地图', 'error');
                return;
            }

            try {
                log('创建自定义样式标记...');
                log('注意：TMap.Marker在GL版本中不可用，使用DOMOverlay替代');

                // 创建自定义样式的DOM标记
                const div = document.createElement('div');
                div.style.cssText = `
                    width: 35px;
                    height: 35px;
                    background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAADLElEQVR42u2Xz2tTURTGf7PdvNPn2tlmrpdGqRVMocZllncmxso5FYUQwhhGEQ0obJkyICwKW1SCEgKNCIPYoYI6YhoKNYYGMjAkaKg6ioBiwiG7KMKwVjzZz3s/7Od9JhOkwz58Z9w9537md9e7u8FAwIJkQSi7SQIKAQBSJBRObJgUJk8a9k+7Pc6YS5EYQAUZRi4niFM4e2bp0fYQBSXE5nOMcE/4SwxZ3yARdEoDAAlMqXAJ4uWcJ/UPeM5T4DQgBMSYmg4PyLflxgK4VjGfMGHOAG3vIqW0mClqvhKBC9mwdC3ySR78O4t6rT0f8QYw+JTqGsUS9UAYF0BCQQoLUh6OqFFGwNyKIaOWqMVcJDMPUeKcnDAkEW9NIaVpDE8EOxLCiNqyk8TQyqU8jQy8hNQVgDIgrVZCmEDiJCCVCaPCm1tM+EPEIciYLpxO5/FDEIBSLGhAlGAQ5iCTgVd3fQcPhkYJ/2pKlgWR5cLlku1krl8+5/5NP1X2l+QFf2L2H1U5P0b0vQcxZj/xM93z1Z0rpYFW6vHk0e3X5jFS4HgQWGPq6sK+ve7/tCpjvSLcvGO32egtxMZxQLFk1vlEzJ/p4eVqf6vWJtbvWl4W6vHjwy3XJxsuXxlbFwly1vlm9yOF97WHc5O91+59slzZZ+XlrJ6nuBod5sF92vJZi2e5FbF5/vGQ9n9/JbGOH3bLOV57E6v9TTRX1kby6P/VrrN74v6LHY73Kb/2cs7feivUd9/g6v9/kDNL71vmVKyPknlP1xFRfy5/lyT5c9cVrz9f67ps1Jj2+1yTNcn6zl6P9Nhi09OyOfGQr5F5tiT7+WJ78N7Zh8JrNg8OaX283FZi89aZT9f2Jrc+Y/RuX/8eQ/n8vz/V/Wlly+ny7pnw+yLz8z4xfJyvJ+uV2v15nh+3ySu35TmxDlV5z+fQtfO7zlXmJ28/jJbHRrKzZj8/sTX7vNivfP2TScv95bH6vlzev87NnP+N3r6sX23Bov59bP7/s6Z9P9FlvneP/Fklz+9rs9fZ8f276j2fmTvl9bvN7YcL57Nfnmv+33JT0/RtVL0/G5nvR/uuU//v6dL//zGSf//qsT//3v3//gDp34wAAAAASUVORK5CYII=');
                    background-size: contain;
                    background-repeat: no-repeat;
                    background-position: center;
                    cursor: pointer;
                    transform: translate(-50%, -100%);
                `;

                if (typeof TMap.DOMOverlay === 'function') {
                    const marker = new TMap.DOMOverlay({
                        map: map,
                        position: new TMap.LatLng(39.908692, 116.397477),
                        content: div
                    });
                    markers.push(marker);
                    log('自定义标记创建成功（使用DOMOverlay）', 'success');
                } else {
                    log('TMap.DOMOverlay不可用', 'error');
                }
            } catch (error) {
                log(`自定义标记创建失败: ${error.message}`, 'error');
                console.error('详细错误:', error);
            }
        }

        function testCanvasMarker() {
            if (!map) {
                log('请先初始化地图', 'error');
                return;
            }

            try {
                log('创建Canvas标记...');
                const canvas = document.createElement('canvas');
                canvas.width = 70;
                canvas.height = 70;
                const ctx = canvas.getContext('2d');

                // 绘制圆形背景
                ctx.beginPath();
                ctx.arc(35, 35, 30, 0, 2 * Math.PI);
                ctx.fillStyle = '#007AFF';
                ctx.fill();

                // 绘制边框
                ctx.beginPath();
                ctx.arc(35, 35, 30, 0, 2 * Math.PI);
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 3;
                ctx.stroke();

                // 绘制图标
                ctx.fillStyle = 'white';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🚗', 35, 30);

                log('Canvas图标创建成功，尝试添加到地图...');

                // 创建包含Canvas图像的DOM元素
                const div = document.createElement('div');
                div.style.cssText = `
                    width: 35px;
                    height: 35px;
                    background-image: url('${canvas.toDataURL()}');
                    background-size: contain;
                    background-repeat: no-repeat;
                    background-position: center;
                    cursor: pointer;
                    transform: translate(-50%, -100%);
                `;

                if (typeof TMap.DOMOverlay === 'function') {
                    const marker = new TMap.DOMOverlay({
                        map: map,
                        position: new TMap.LatLng(39.908692, 116.397477),
                        content: div
                    });
                    markers.push(marker);
                    log('Canvas标记创建成功（使用DOMOverlay）', 'success');
                } else {
                    log('TMap.DOMOverlay不可用', 'error');
                }
            } catch (error) {
                log(`Canvas标记创建失败: ${error.message}`, 'error');
                console.error('详细错误:', error);
            }
        }

        function testCarMarker() {
            if (!map) {
                log('请先初始化地图', 'error');
                return;
            }

            const carInfo = {
                name: '雷克萨斯LS200',
                plate: '浙A5W717',
                color: '#FF6B6B'
            };

            try {
                log(`创建车辆标记: ${carInfo.name}...`);
                log(`车辆信息: ${JSON.stringify(carInfo)}`);

                // 使用DOMOverlay创建标记（与主应用一致）
                const div = document.createElement('div');
                div.style.cssText = `
                    width: 50px;
                    height: 50px;
                    background: ${carInfo.color || '#007AFF'};
                    border-radius: 50%;
                    border: 3px solid white;
                    box-shadow: 0 2px 8px rgba(0,0,0,0.3), 0 0 20px rgba(0,0,0,0.2);
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    color: white;
                    font-size: 20px;
                    font-weight: bold;
                    position: relative;
                    z-index: 1000;
                    cursor: pointer;
                    user-select: none;
                    transition: transform 0.2s ease;
                `;
                div.innerHTML = `
                    <div style="font-size: 24px;">🚗</div>
                    <div style="font-size: 8px; margin-top: -5px;">${carInfo.name.substring(0, 2)}</div>
                `;
                div.title = `${carInfo.name} (${carInfo.plate})`;

                // 添加悬停效果
                div.onmouseover = function() {
                    this.style.transform = 'scale(1.1)';
                };
                div.onmouseout = function() {
                    this.style.transform = 'scale(1)';
                };

                if (typeof TMap.DOMOverlay === 'function') {
                    log('使用TMap.DOMOverlay创建标记...');
                    const marker = new TMap.DOMOverlay({
                        map: map,
                        position: new TMap.LatLng(39.908692, 116.397477),
                        content: div
                    });

                    markers.push(marker);
                    log('车辆标记创建成功（使用DOMOverlay）', 'success');

                    // 添加点击事件
                    div.onclick = function() {
                        log(`点击了车辆标记: ${carInfo.name} (${carInfo.plate})`, 'success');
                    };
                } else {
                    log('TMap.DOMOverlay不可用，尝试备用方案', 'error');
                    // 备用方案：直接在地图上创建一个简单的div
                    testSimpleDOMMarker(carInfo);
                }

            } catch (error) {
                log(`车辆标记创建失败: ${error.message}`, 'error');
                console.error('详细错误:', error);
                // 尝试最简单的方案
                testSimpleDOMMarker(carInfo);
            }
        }

        function testSimpleDOMMarker(carInfo) {
            try {
                log('尝试使用简单DOM标记...');

                // 创建一个绝对定位的div作为标记
                const markerDiv = document.createElement('div');
                markerDiv.id = 'simple-marker-' + Date.now();
                markerDiv.style.cssText = `
                    position: absolute;
                    width: 50px;
                    height: 50px;
                    background: ${carInfo.color || '#007AFF'};
                    border-radius: 50%;
                    border: 3px solid white;
                    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    color: white;
                    font-size: 24px;
                    z-index: 1000;
                    cursor: pointer;
                    transform: translate(-50%, -50%);
                    left: 50%;
                    top: 50%;
                `;
                markerDiv.innerHTML = '🚗';
                markerDiv.title = `${carInfo.name} (${carInfo.plate})`;

                // 添加到地图容器
                const mapContainer = document.getElementById('map');
                if (mapContainer) {
                    mapContainer.style.position = 'relative';
                    mapContainer.appendChild(markerDiv);
                    markers.push({ element: markerDiv, type: 'dom' });
                    log('简单DOM标记创建成功', 'success');

                    markerDiv.onclick = function() {
                        log(`点击了简单DOM标记: ${carInfo.name} (${carInfo.plate})`, 'success');
                    };
                } else {
                    log('找不到地图容器', 'error');
                }
            } catch (error) {
                log(`简单DOM标记创建失败: ${error.message}`, 'error');
            }
        }

        function clearMarkers() {
            log('清除所有标记...');
            markers.forEach(marker => {
                try {
                    if (marker.type === 'dom' && marker.element) {
                        // 清除DOM标记
                        if (marker.element.parentNode) {
                            marker.element.parentNode.removeChild(marker.element);
                        }
                    } else if (marker.setMap) {
                        // 清除TMap标记
                        marker.setMap(null);
                    }
                } catch (error) {
                    log(`清除标记失败: ${error.message}`, 'error');
                }
            });
            markers = [];
            log('标记清除完成', 'success');
        }

        // 页面加载后初始化
        window.onload = function() {
            log('页面加载完成，开始初始化...');
            initMap();
        };
    </script>
</body>
</html>
