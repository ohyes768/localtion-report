<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地图测试页面</title>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 100vh; }
        .info { position: absolute; top: 10px; left: 10px; background: white; padding: 10px; border-radius: 5px; z-index: 1000; }
    </style>
</head>
<body>
    <div class="info">
        <h3>地图加载测试</h3>
        <p id="status">正在加载地图...</p>
        <button onclick="testLocation()">测试定位</button>
    </div>
    <div id="map"></div>

    <script src="https://map.qq.com/api/gljs?v=1.exp&key=67PBZ-AWOWQ-TTW5A-BTI3M-BNMHH-2YBXZ"></script>
    <script>
        let map;
        let marker;

        function updateStatus(message, isError = false) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.style.color = isError ? 'red' : 'green';
        }

        function initMap() {
            try {
                updateStatus('正在创建地图实例...');

                map = new TMap.Map('map', {
                    center: new TMap.LatLng(39.908692, 116.397477),
                    zoom: 16
                });

                updateStatus('地图创建成功！');

                // 添加一个测试标记
                marker = new TMap.Marker({
                    map: map,
                    position: new TMap.LatLng(39.908692, 116.397477)
                });

                updateStatus('地图和标记加载完成！点击"测试定位"获取真实位置');

            } catch (error) {
                updateStatus(`地图加载失败: ${error.message}`, true);
                console.error('地图加载错误:', error);
            }
        }

        function testLocation() {
            if (!navigator.geolocation) {
                updateStatus('浏览器不支持定位功能', true);
                return;
            }

            updateStatus('正在获取位置...');

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    updateStatus(`定位成功！精度: ${position.coords.accuracy}米`);

                    // 移动地图到当前位置
                    if (map) {
                        map.setCenter(new TMap.LatLng(lat, lng));

                        // 更新标记位置
                        if (marker) {
                            marker.setPosition(new TMap.LatLng(lat, lng));
                        }
                    }
                },
                (error) => {
                    updateStatus(`定位失败: ${error.message}`, true);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000
                }
            );
        }

        // 页面加载完成后初始化地图
        window.onload = initMap;
    </script>
</body>
</html>
