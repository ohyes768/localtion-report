<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定位失败场景测试</title>
    <script charset="utf-8" src="https://map.qq.com/api/gljs?v=1.exp&key=67PBZ-AWOWQ-TTW5A-BTI3M-BNMHH-2YBXZ"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .test-scenarios {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            padding: 20px;
            margin: 20px;
        }
        .test-scenarios h3 {
            color: #495057;
            margin-bottom: 15px;
            text-align: center;
        }
        .scenario-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .scenario-btn {
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .permission-denied {
            background: #dc3545;
            color: white;
        }
        .timeout {
            background: #fd7e14;
            color: white;
        }
        .normal {
            background: #28a745;
            color: white;
        }
        .location-unavailable {
            background: #6f42c1;
            color: white;
        }
        .scenario-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .scenario-btn .icon {
            font-size: 24px;
        }
        .scenario-btn .text {
            font-size: 12px;
            opacity: 0.9;
        }
        .status-display {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin: 20px;
            display: none;
        }
        .status-display.active {
            display: block;
        }
        .status-display h4 {
            margin: 0 0 10px 0;
            color: #495057;
        }
        .status-display .status-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #f1f3f4;
        }
        .status-display .status-item:last-child {
            border-bottom: none;
        }
        .status-display .label {
            font-weight: 500;
            color: #6c757d;
        }
        .status-display .value {
            color: #343a40;
            font-family: 'Monaco', 'Courier New', monospace;
        }
        .info-box {
            background: #e3f2fd;
            border: 1px solid #bbdefb;
            border-radius: 8px;
            padding: 15px;
            margin: 20px;
        }
        .info-box h4 {
            margin: 0 0 10px 0;
            color: #1976d2;
        }
        .info-box ul {
            margin: 0;
            padding-left: 20px;
        }
        .info-box li {
            margin-bottom: 5px;
            color: #424242;
        }
    </style>
</head>
<body>
    <!-- 地图展示页面 -->
    <div id="map-page" class="page active">
        <div class="test-scenarios">
            <h3>🧪 定位失败场景测试</h3>
            <div class="scenario-buttons">
                <button class="scenario-btn permission-denied" onclick="testPermissionDenied()">
                    <span class="icon">🚫</span>
                    <span class="text">权限被拒绝</span>
                </button>
                <button class="scenario-btn timeout" onclick="testTimeout()">
                    <span class="icon">⏰</span>
                    <span class="text">定位超时</span>
                </button>
                <button class="scenario-btn location-unavailable" onclick="testLocationUnavailable()">
                    <span class="icon">❌</span>
                    <span class="text">位置不可用</span>
                </button>
                <button class="scenario-btn normal" onclick="testNormalLocation()">
                    <span class="icon">✅</span>
                    <span class="text">正常定位</span>
                </button>
            </div>
        </div>

        <div class="info-box">
            <h4>📋 测试说明</h4>
            <ul>
                <li><strong>权限被拒绝</strong>: 模拟用户点击"一律不允许"的情况</li>
                <li><strong>定位超时</strong>: 模拟网络或设备问题导致的超时</li>
                <li><strong>位置不可用</strong>: 模拟设备不支持定位的情况</li>
                <li><strong>正常定位</strong>: 测试正常的定位流程</li>
            </ul>
        </div>

        <div id="status-display" class="status-display">
            <h4>📊 测试状态</h4>
            <div class="status-item">
                <span class="label">测试场景:</span>
                <span class="value" id="test-scenario">-</span>
            </div>
            <div class="status-item">
                <span class="label">最终结果:</span>
                <span class="value" id="test-result">-</span>
            </div>
            <div class="status-item">
                <span class="label">经纬度:</span>
                <span class="value" id="test-coordinates">-</span>
            </div>
            <div class="status-item">
                <span class="label">定位来源:</span>
                <span class="value" id="test-provider">-</span>
            </div>
            <div class="status-item">
                <span class="label">浏览器策略:</span>
                <span class="value" id="test-strategy">-</span>
            </div>
            <div class="status-item">
                <span class="label">失败原因:</span>
                <span class="value" id="test-failure-reason">-</span>
            </div>
            <div class="status-item">
                <span class="label">耗时:</span>
                <span class="value" id="test-duration">-</span>
            </div>
        </div>

        <div class="map-header">
            <h2 id="location-title">定位失败测试</h2>
            <p id="location-address">地址加载中...</p>

            <!-- 经纬度信息显示区域 -->
            <div id="coordinates-info" class="coordinates-info" style="display: none;">
                <div class="coordinates-container">
                    <div class="coordinate-item">
                        <span class="coordinate-label">📍 经纬度:</span>
                        <span id="coordinates-display" class="coordinate-value">加载中...</span>
                        <button id="copy-coordinates-btn" class="copy-btn" title="复制经纬度">
                            <span class="icon">📋</span>
                        </button>
                    </div>
                    <div class="coordinate-details">
                        <div class="detail-item">
                            <span class="detail-label">精度:</span>
                            <span id="accuracy-display" class="detail-value">-</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">来源:</span>
                            <span id="provider-display" class="detail-value">-</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">时间:</span>
                            <span id="time-display" class="detail-value">-</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="location-analysis" id="location-analysis" style="display: none;"></div>
        </div>

        <div id="map-container" style="height: 400px;"></div>

        <div class="action-buttons">
            <button id="refresh-btn" class="btn">
                <span class="icon">🔄</span> 重新测试
            </button>
            <button id="share-btn" class="btn primary">
                <span class="icon">📤</span> 分享位置
            </button>
        </div>
    </div>

    <!-- Toast提示 -->
    <div id="toast" class="toast"></div>

    <!-- 加载脚本 -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
        <script src="js/browser-detection.js"></script>
        <script src="js/location.js"></script>
        <script src="js/map.js"></script>

    <script>
        // 定位失败测试应用
        class LocationFailureTestApp {
            constructor() {
                this.currentLocation = null;
                this.locationManager = new LocationManager();
                this.mapManager = new MapManager();
                this.testCar = {
                    name: '测试车辆',
                    plate: '京TEST123',
                    color: '#007AFF'
                };
                this.currentTestScenario = null;
                this.init();
            }

            async init() {
                try {
                    console.log('🚀 开始初始化定位失败测试应用...');

                    // 检查腾讯地图API
                    if (typeof TMap === 'undefined') {
                        throw new Error('腾讯地图API未加载');
                    }

                    // 初始化定位管理器
                    if (typeof browserDetection !== 'undefined') {
                        const tencentEnabled = this.locationManager.enableTencentLocation();
                        console.log(`🎯 腾讯定位组件: ${tencentEnabled ? '✅ 已启用' : '❌ 未启用'}`);
                    }

                    // 绑定事件
                    this.bindEvents();

                    console.log('✅ 初始化完成');
                    Utils.showToast('定位失败测试应用初始化完成');

                } catch (error) {
                    console.error('初始化失败:', error);
                    Utils.showToast('初始化失败: ' + error.message);
                }
            }

            bindEvents() {
                // 复制经纬度按钮
                const copyCoordinatesBtn = document.getElementById('copy-coordinates-btn');
                if (copyCoordinatesBtn) {
                    copyCoordinatesBtn.addEventListener('click', () => {
                        this.copyCoordinates();
                    });
                }

                // 分享位置按钮
                const shareBtn = document.getElementById('share-btn');
                if (shareBtn) {
                    shareBtn.addEventListener('click', () => {
                        this.shareLocation();
                    });
                }

                // 重新测试按钮
                const refreshBtn = document.getElementById('refresh-btn');
                if (refreshBtn) {
                    refreshBtn.addEventListener('click', () => {
                        this.hideStatusDisplay();
                        Utils.showToast('请选择测试场景');
                    });
                }
            }

            // 测试权限被拒绝
            async testPermissionDenied() {
                await this.runTest('权限被拒绝', async () => {
                    // 覆盖navigator.geolocation.getCurrentPosition来模拟权限被拒绝
                    const originalGetCurrentPosition = navigator.geolocation.getCurrentPosition;

                    navigator.geolocation.getCurrentPosition = (success, error, options) => {
                        // 直接调用错误回调，模拟权限被拒绝
                        const permissionError = new Error('User denied the request for Geolocation.');
                        permissionError.code = 1; // PERMISSION_DENIED
                        error(permissionError);
                    };

                    try {
                        const location = await this.locationManager.getCurrentPosition();
                        this.showTestResult('权限被拒绝', location, true);
                    } catch (error) {
                        this.showTestResult('权限被拒绝', null, false);
                    } finally {
                        // 恢复原方法
                        navigator.geolocation.getCurrentPosition = originalGetCurrentPosition;
                    }
                });
            }

            // 测试定位超时
            async testTimeout() {
                await this.runTest('定位超时', async () => {
                    const originalGetCurrentPosition = navigator.geolocation.getCurrentPosition;

                    navigator.geolocation.getCurrentPosition = (success, error, options) => {
                        // 设置很短的超时时间来模拟超时
                        const timeoutError = new Error('Position acquisition timed out.');
                        timeoutError.code = 3; // TIMEOUT
                        setTimeout(() => {
                            error(timeoutError);
                        }, 100); // 100ms超时
                    };

                    try {
                        const location = await this.locationManager.getCurrentPosition();
                        this.showTestResult('定位超时', location, true);
                    } catch (error) {
                        this.showTestResult('定位超时', null, false);
                    } finally {
                        navigator.geolocation.getCurrentPosition = originalGetCurrentPosition;
                    }
                });
            }

            // 测试位置不可用
            async testLocationUnavailable() {
                await this.runTest('位置不可用', async () => {
                    const originalGetCurrentPosition = navigator.geolocation.getCurrentPosition;

                    navigator.geolocation.getCurrentPosition = (success, error, options) => {
                        // 模拟位置服务不可用
                        const unavailableError = new Error('Network location provider at \'https://www.googleapis.com/\' : Network location provider is not available. User denied Geolocation.');
                        unavailableError.code = 2; // POSITION_UNAVAILABLE
                        error(unavailableError);
                    };

                    try {
                        const location = await this.locationManager.getCurrentPosition();
                        this.showTestResult('位置不可用', location, true);
                    } catch (error) {
                        this.showTestResult('位置不可用', null, false);
                    } finally {
                        navigator.geolocation.getCurrentPosition = originalGetCurrentPosition;
                    }
                });
            }

            // 测试正常定位
            async testNormalLocation() {
                await this.runTest('正常定位', async () => {
                    try {
                        const location = await this.locationManager.getCurrentPosition();
                        this.showTestResult('正常定位', location, true);
                    } catch (error) {
                        this.showTestResult('正常定位', null, false);
                    }
                });
            }

            // 运行测试
            async runTest(scenario, testFunction) {
                this.currentTestScenario = scenario;
                this.showStatusDisplay();
                this.updateStatus('测试场景', scenario);
                this.updateStatus('最终结果', '测试中...');
                this.updateStatus('经纬度', '测试中...');
                this.updateStatus('定位来源', '测试中...');
                this.updateStatus('浏览器策略', '测试中...');
                this.updateStatus('失败原因', '测试中...');
                this.updateStatus('耗时', '测试中...');

                const startTime = Date.now();

                try {
                    await testFunction();
                } catch (error) {
                    const duration = Date.now() - startTime;
                    this.updateStatus('最终结果', '❌ 失败');
                    this.updateStatus('耗时', `${duration}ms`);
                    console.error('测试执行失败:', error);
                }
            }

            // 显示测试结果
            showTestResult(scenario, location, success) {
                const duration = Date.now() - (this.startTime || Date.now());

                this.updateStatus('最终结果', success ? '✅ 成功' : '🔴 失败');
                this.updateStatus('耗时', `${duration}ms`);

                if (location) {
                    this.currentLocation = location;

                    // 更新经纬度信息显示
                    this.updateCoordinatesDisplay(location);

                    // 更新状态显示
                    this.updateStatus('经纬度', `${location.lat.toFixed(6)}, ${location.lng.toFixed(6)}`);
                    this.updateStatus('定位来源', location.provider || '未知');
                    this.updateStatus('浏览器策略', location.browserStrategy || '未知');
                    this.updateStatus('失败原因', location.failureReason || 'N/A');

                    // 如果地图已初始化，更新地图
                    if (this.mapManager.isMapLoaded) {
                        await this.updateMap(location);
                    } else {
                        // 初始化地图
                        await this.initializeMap(location);
                    }

                    Utils.showToast(`✅ ${scenario}测试完成 - 使用${location.isDefaultLocation ? '默认' : '真实'}位置`);
                } else {
                    Utils.showToast(`❌ ${scenario}测试失败 - ${success ? '应该成功但失败了' : '预期失败'}`);
                }
            }

            // 更新状态显示
            updateStatus(field, value) {
                const element = document.getElementById(`test-${field}`);
                if (element) {
                    element.textContent = value;
                }
            }

            // 显示/隐藏状态显示
            showStatusDisplay() {
                const statusDisplay = document.getElementById('status-display');
                if (statusDisplay) {
                    statusDisplay.classList.add('active');
                }
            }

            hideStatusDisplay() {
                const statusDisplay = document.getElementById('status-display');
                if (statusDisplay) {
                    statusDisplay.classList.remove('active');
                }
            }

            // 更新经纬度信息显示
            updateCoordinatesDisplay(location) {
                if (!location) {
                    return;
                }

                try {
                    // 显示经纬度信息容器
                    const coordinatesInfo = document.getElementById('coordinates-info');
                    if (coordinatesInfo) {
                        coordinatesInfo.style.display = 'block';
                    }

                    // 更新经纬度显示
                    const coordinatesDisplay = document.getElementById('coordinates-display');
                    if (coordinatesDisplay) {
                        const lat = location.lat.toFixed(6);
                        const lng = location.lng.toFixed(6);
                        coordinatesDisplay.textContent = `${lat}, ${lng}`;

                        // 如果是默认位置，添加标识
                        if (location.isDefaultLocation) {
                            coordinatesDisplay.style.color = '#ff9500';
                            coordinatesDisplay.style.fontStyle = 'italic';
                        } else {
                            coordinatesDisplay.style.color = '#0066cc';
                            coordinatesDisplay.style.fontStyle = 'normal';
                        }
                    }

                    // 更新精度信息
                    const accuracyDisplay = document.getElementById('accuracy-display');
                    if (accuracyDisplay) {
                        const accuracy = location.accuracy ? Math.round(location.accuracy) : '未知';
                        if (location.isDefaultLocation) {
                            accuracyDisplay.innerHTML = `${accuracy}米 <small style="color: #ff9500;">(默认位置)</small>`;
                        } else {
                            accuracyDisplay.textContent = `${accuracy}米`;
                        }
                    }

                    // 更新定位来源
                    const providerDisplay = document.getElementById('provider-display');
                    if (providerDisplay) {
                        if (location.isDefaultLocation) {
                            provider = `🧪 ${location.provider}`;
                            providerDisplay.style.color = '#ff9500';
                        } else {
                            provider = location.provider || '未知';
                            providerDisplay.style.color = '#007AFF';
                        }
                        providerDisplay.textContent = provider;
                    }

                    // 更新定位时间
                    const timeDisplay = document.getElementById('time-display');
                    if (timeDisplay) {
                        const time = new Date(location.timestamp || Date.now());
                        const timeText = Utils.formatTime(time);

                        if (location.isDefaultLocation) {
                            timeDisplay.innerHTML = `${timeText} <small style="color: #ff9500;">(测试)</small>`;
                        } else {
                            timeDisplay.textContent = timeText;
                        }
                    }

                    console.log('✅ 经纬度信息更新完成:', {
                        coordinates: `${location.lat.toFixed(6)}, ${location.lng.toFixed(6)}`,
                        accuracy: location.accuracy,
                        provider: location.provider,
                        strategy: location.browserStrategy,
                        failureReason: location.failureReason,
                        isDefault: location.isDefaultLocation
                    });

                } catch (error) {
                    console.error('更新经纬度显示失败:', error);
                }
            }

            // 初始化地图
            async initializeMap(location) {
                try {
                    const container = document.getElementById('map-container');
                    await this.mapManager.initializeMap(container, location, 16);
                    await this.updateMap(location);
                } catch (error) {
                    console.error('地图初始化失败:', error);
                    Utils.showToast('地图初始化失败: ' + error.message);
                }
            }

            // 更新地图
            async updateMap(location) {
                try {
                    this.mapManager.addMarker(location, this.testCar);

                    // 获取并显示地址
                    try {
                        const address = await this.mapManager.getAddressFromLocation(location);
                        document.getElementById('location-address').textContent = address;
                    } catch (error) {
                        document.getElementById('location-address').textContent = location.address || '地址获取失败';
                        console.warn('地址获取失败:', error);
                    }

                } catch (error) {
                    console.error('更新地图失败:', error);
                }
            }

            // 复制经纬度
            async copyCoordinates() {
                try {
                    if (!this.currentLocation) {
                        Utils.showToast('暂无经纬度信息');
                        return;
                    }

                    const lat = this.currentLocation.lat.toFixed(6);
                    const lng = this.currentLocation.lng.toFixed(6);
                    const accuracy = this.currentLocation.accuracy ? Math.round(this.currentLocation.accuracy) : '未知';
                    const time = Utils.formatTime(new Date(this.currentLocation.timestamp || Date.now()));
                    const locationType = this.currentLocation.isDefaultLocation ? '（默认位置）' : '';
                    const failureReason = this.currentLocation.failureReason ? ` - 失败原因: ${this.currentLocation.failureReason}` : '';

                    // 构建经纬度信息文本
                    const coordinatesText = `定位失败测试结果

🧪 测试场景: ${this.currentTestScenario}
📍 经纬度: ${lat}, ${lng}
🎯 精度: ${accuracy}米
🕐 定位时间: ${time}
🚗 车牌号: ${this.testCar.plate}
📍 位置: ${this.currentLocation.address || '杭州西湖'}
🔧 定位来源: ${this.currentLocation.provider || '未知'}
📱 浏览器策略: ${this.currentLocation.browserStrategy || '未知'}${locationType}${failureReason}

---
由车辆位置分享系统生成`;

                    const success = await Utils.copyToClipboard(coordinatesText);

                    if (success) {
                        Utils.showToast('✅ 测试结果已复制到剪贴板');
                    } else {
                        Utils.showToast('请手动复制测试结果');
                    }

                } catch (error) {
                    console.error('复制经纬度失败:', error);
                    Utils.showToast('复制经纬度失败，请手动复制');
                }
            }

            // 分享位置
            async shareLocation() {
                if (!this.currentLocation) {
                    Utils.showToast('请先运行测试获取位置信息');
                    return;
                }

                try {
                    // 生成腾讯位置服务分享页面
                    const sharePageUrl = await this.mapManager.generateSharePage(
                        this.currentLocation,
                        this.testCar
                    );

                    // 在新窗口中打开分享页面
                    const newWindow = window.open(sharePageUrl, '_blank', 'width=400,height=600,scrollbars=yes');

                    if (newWindow) {
                        Utils.showToast('✅ 分享页面已打开');
                    } else {
                        Utils.showToast('请允许弹出窗口或复制链接分享');
                    }

                } catch (error) {
                    console.error('分享失败:', error);
                    Utils.showToast('分享失败: ' + error.message);
                }
            }
        }

        // 启动应用
        document.addEventListener('DOMContentLoaded', () => {
            window.testApp = new LocationFailureTestApp();
        });
    </script>
</body>
</html>
