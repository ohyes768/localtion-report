<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>腾讯地图API测试</title>
    <style>
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 400px; border: 1px solid #ccc; }
        .info { margin: 10px 0; padding: 10px; background: #f0f0f0; border-radius: 5px; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
        .debug { background: #fff3e0; color: #e65100; }
        button { padding: 8px 16px; margin: 5px; background: #007AFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>腾讯地图API完整测试</h1>

    <div class="info">测试信息：<span id="test-info">准备开始测试...</span></div>

    <div class="info debug">API版本：<span id="api-version">检测中...</span></div>

    <div id="map"></div>

    <div style="margin-top: 20px;">
        <button onclick="testBasicMap()">测试基础地图</button>
        <button onclick="testMarker()">测试标记</button>
        <button onclick="testGeocoder()">测试地址解析</button>
    </div>

    <script charset="utf-8" src="https://map.qq.com/api/gljs?v=1.exp&key=67PBZ-AWOWQ-TTW5A-BTI3M-BNMHH-2YBXZ"></script>
    <script>
        const infoSpan = document.getElementById('test-info');
        const versionSpan = document.getElementById('api-version');
        let map = null;

        function updateInfo(message, type = 'info') {
            infoSpan.textContent = message;
            infoSpan.parentElement.className = `info ${type}`;
        }

        function updateVersion() {
            if (typeof TMap !== 'undefined') {
                versionSpan.textContent = 'TMap GL v1.exp';
            } else {
                versionSpan.textContent = 'TMap未定义';
            }
        }

        function testBasicMap() {
            updateInfo('正在测试基础地图...', 'debug');

            if (typeof TMap === 'undefined') {
                updateInfo('TMap未定义，API可能未正确加载', 'error');
                return;
            }

            try {
                // 销毁旧地图
                if (map) {
                    map.destroy();
                    map = null;
                }

                updateInfo('创建地图实例...', 'debug');

                // 创建地图
                map = new TMap.Map('map', {
                    center: new TMap.LatLng(39.908692, 116.397477), // 北京天安门
                    zoom: 16
                });

                updateInfo('基础地图创建成功！', 'success');

            } catch (error) {
                updateInfo(`基础地图创建失败: ${error.message}`, 'error');
                console.error('地图创建错误:', error);
            }
        }

        function testMarker() {
            updateInfo('正在测试标记...', 'debug');

            if (!map) {
                updateInfo('请先创建地图', 'error');
                return;
            }

            try {
                updateInfo('检查TMap.Marker...', 'debug');

                // 检查Marker构造函数
                if (typeof TMap.Marker !== 'function') {
                    updateInfo('TMap.Marker不是构造函数，可能需要其他方式', 'error');

                    // 尝试其他标记方式
                    if (TMap.DOMOverlay && typeof TMap.DOMOverlay === 'function') {
                        updateInfo('尝试使用DOMOverlay创建标记...', 'debug');
                        testDOMOverlay();
                        return;
                    }
                    return;
                }

                updateInfo('创建标记实例...', 'debug');

                // 创建标记
                const marker = new TMap.Marker({
                    map: map,
                    position: new TMap.LatLng(39.908692, 116.397477),
                    styles: {
                        'myMarker': new TMap.MarkerStyle({
                            width: 25,
                            height: 35,
                            anchor: { x: 12, y: 35 },
                            src: 'https://mapapi.qq.com/web/mapComponents/img/marker.png'
                        })
                    },
                    styleId: 'myMarker'
                });

                updateInfo('标记创建成功！', 'success');

            } catch (error) {
                updateInfo(`标记创建失败: ${error.message}`, 'error');
                console.error('标记创建错误:', error);

                // 显示详细的错误信息
                console.log('TMap对象:', TMap);
                console.log('TMap.Marker:', TMap.Marker);
                console.log('TMap的所有属性:', Object.keys(TMap));
            }
        }

        function testDOMOverlay() {
            try {
                const div = document.createElement('div');
                div.style.cssText = `
                    width: 20px;
                    height: 20px;
                    background: red;
                    border-radius: 50%;
                    border: 2px solid white;
                    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
                `;

                const marker = new TMap.DOMOverlay({
                    map: map,
                    position: new TMap.LatLng(39.908692, 116.397477),
                    content: div
                });

                updateInfo('使用DOMOverlay创建标记成功！', 'success');

            } catch (error) {
                updateInfo(`DOMOverlay标记创建失败: ${error.message}`, 'error');
            }
        }

        function testGeocoder() {
            updateInfo('正在测试地址解析...', 'debug');

            // 使用JSONP方式避免跨域问题
            const script = document.createElement('script');
            const callbackName = 'geocoderCallback_' + Date.now();

            window[callbackName] = function(data) {
                delete window[callbackName];
                document.body.removeChild(script);

                if (data.status === 0) {
                    updateInfo(`地址解析成功: ${data.result.address}`, 'success');
                } else {
                    updateInfo(`地址解析失败: ${data.message}`, 'error');
                }
            };

            script.onerror = function() {
                delete window[callbackName];
                document.body.removeChild(script);
                updateInfo('地址解析脚本加载失败', 'error');
            };

            script.src = `https://apis.map.qq.com/ws/geocoder/v1/?location=39.908692,116.397477&key=67PBZ-AWOWQ-TTW5A-BTI3M-BNMHH-2YBXZ&output=jsonp&callback=${callbackName}`;

            document.body.appendChild(script);
        }

        // 页面加载完成后初始化
        window.onload = function() {
            updateVersion();
            setTimeout(testBasicMap, 1000);
        };
    </script>
</body>
</html>
