<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试Iframe分享功能</title>
    <script charset="utf-8" src="https://map.qq.com/api/gljs?v=1.exp&key=67PBZ-AWOWQ-TTW5A-BTI3M-BNMHH-2YBXZ"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .test-info {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin: 20px;
        }
        .test-info h3 {
            color: #495057;
            margin-bottom: 10px;
        }
        .test-info p {
            color: #6c757d;
            margin: 5px 0;
        }
        .iframe-container {
            margin: 20px;
            border: 2px solid #007AFF;
            border-radius: 10px;
            overflow: hidden;
        }
        .test-result {
            margin: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="map-header">
        <h2>🧪 Iframe分享功能测试</h2>
        <p>测试腾讯地图位置标记页面的iframe嵌入功能</p>
    </div>

    <div class="test-info">
        <h3>🎯 测试目标</h3>
        <p>1. 生成腾讯地图标记页面URL</p>
        <p>2. 使用iframe嵌入腾讯地图标记页面</p>
        <p>3. 验证不会出现ServiceWorker错误</p>
        <p>4. 测试默认位置（杭州西湖）的分享功能</p>
    </div>

    <div class="action-buttons">
        <button id="test-default-share" class="btn primary">
            <span class="icon">🧪</span> 测试默认位置分享
        </button>
        <button id="test-current-location" class="btn">
            <span class="icon">📍</span> 测试当前位置分享
        </button>
    </div>

    <div id="test-result" class="test-result" style="display: none;"></div>

    <div class="iframe-container">
        <iframe id="share-iframe"
                style="width: 100%; height: 500px; border: none;"
                frameborder="0">
        </iframe>
    </div>

    <!-- Toast提示 -->
    <div id="toast" class="toast"></div>

    <!-- 加载脚本 -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/browser-detection.js"></script>
    <script src="js/location.js"></script>
    <script src="js/map.js"></script>

    <script>
        class IframeShareTest {
            constructor() {
                this.locationManager = new LocationManager();
                this.mapManager = new MapManager();
                this.testCar = {
                    name: '测试车辆',
                    plate: '浙TEST123',
                    color: '#007AFF'
                };
                this.init();
            }

            async init() {
                this.bindEvents();
                Utils.showToast('iframe分享测试初始化完成');
            }

            bindEvents() {
                document.getElementById('test-default-share').addEventListener('click', () => {
                    this.testDefaultLocationShare();
                });

                document.getElementById('test-current-location').addEventListener('click', () => {
                    this.testCurrentLocationShare();
                });
            }

            async testDefaultLocationShare() {
                try {
                    Utils.showToast('🧪 测试默认位置分享...');

                    // 使用默认位置（杭州西湖）
                    const defaultLocation = JSON.parse(JSON.stringify(MAP_CONFIG.defaultLocation));
                    defaultLocation.timestamp = Date.now();
                    defaultLocation.provider = '测试默认位置';
                    defaultLocation.address = '浙江省杭州市西湖区西湖风景名胜区';

                    // 生成分享页面URL
                    const shareUrl = await this.mapManager.generateSharePage(defaultLocation, this.testCar);

                    console.log('🎯 分享URL:', shareUrl);

                    // 更新iframe
                    const iframe = document.getElementById('share-iframe');
                    iframe.src = shareUrl;

                    // 显示测试结果
                    this.showTestResult(true, `✅ 默认位置分享测试成功！<br>URL: ${shareUrl}`);

                    Utils.showToast('✅ 默认位置分享测试成功');

                } catch (error) {
                    console.error('❌ 默认位置分享测试失败:', error);
                    this.showTestResult(false, `❌ 默认位置分享测试失败: ${error.message}`);
                    Utils.showToast('❌ 测试失败: ' + error.message);
                }
            }

            async testCurrentLocationShare() {
                try {
                    Utils.showToast('📍 获取当前位置...');

                    // 获取当前位置
                    const location = await this.locationManager.getCurrentLocation();

                    // 生成分享页面URL
                    const shareUrl = await this.mapManager.generateSharePage(location, this.testCar);

                    console.log('🎯 分享URL:', shareUrl);

                    // 更新iframe
                    const iframe = document.getElementById('share-iframe');
                    iframe.src = shareUrl;

                    // 显示测试结果
                    this.showTestResult(true, `✅ 当前位置分享测试成功！<br>URL: ${shareUrl}`);

                    Utils.showToast('✅ 当前位置分享测试成功');

                } catch (error) {
                    console.error('❌ 当前位置分享测试失败:', error);

                    // 如果定位失败，使用默认位置测试
                    Utils.showToast('📍 定位失败，使用默认位置测试...');
                    await this.testDefaultLocationShare();
                }
            }

            showTestResult(success, message) {
                const resultDiv = document.getElementById('test-result');
                resultDiv.style.display = 'block';
                resultDiv.className = `test-result ${success ? 'success' : 'error'}`;
                resultDiv.innerHTML = message;
            }
        }

        // 启动测试
        document.addEventListener('DOMContentLoaded', () => {
            window.testApp = new IframeShareTest();
        });
    </script>
</body>
</html>
