<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车辆位置分享 - 选择车辆</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- 自定义样式 -->
    <link rel="stylesheet" href="css/vehicle-select.css">
</head>
<body>
    <div class="container vehicle-select-container">
        <!-- 页面标题 -->
        <header class="text-center py-4">
            <h1 class="main-title">家庭车辆位置分享系统</h1>
            <p class="subtitle text-muted">记录和分享车辆位置</p>
        </header>

        <!-- 车辆选择模块 -->
        <section class="vehicle-selection">
            <h2 class="section-title">选择车辆</h2>
            <div class="row g-3" id="vehicle-grid">
                <!-- 车辆卡片将由JavaScript动态生成 -->
            </div>
        </section>
    </div>

    <!-- 脚本 -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/modules/vehicle-card.js"></script>
    <script src="js/modules/vehicle-selector.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new VehicleSelector();
        });
    </script>
</body>
</html>
