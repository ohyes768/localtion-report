<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>腾讯地图API Key测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #e8f5e8; color: #2e7d32; }
        .error { background: #ffebee; color: #c62828; }
        .info { background: #e3f2fd; color: #1565c0; }
        button { padding: 8px 16px; margin: 5px; background: #007AFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>腾讯地图API Key测试</h1>

    <div id="results"></div>

    <button onclick="testAPIKey()">测试API Key有效性</button>
    <button onclick="testDirectGeocoder()">测试直接地址解析</button>
    <button onclick="testWithDifferentKey()">测试不同格式请求</button>

    <script>
        const resultsDiv = document.getElementById('results');
        const API_KEY = '67PBZ-AWOWQ-TTW5A-BTI3M-BNMHH-2YBXZ';

        function addResult(message, type = 'info', details = '') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            if (details) {
                div.innerHTML += `<pre>${details}</pre>`;
            }
            resultsDiv.appendChild(div);
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        }

        async function testAPIKey() {
            addResult('开始测试API Key...', 'info');

            try {
                // 测试基础API调用
                const url = `https://apis.map.qq.com/ws/geocoder/v1/?location=39.908692,116.397477&key=${API_KEY}&output=jsonp`;

                addResult(`尝试请求: ${url}`, 'info');

                // 尝试使用fetch（会失败，但能看到错误）
                const response = await fetch(url);
                const text = await response.text();
                addResult(`Fetch响应: ${response.status} - ${response.statusText}`, response.ok ? 'success' : 'error', text);

            } catch (error) {
                addResult(`Fetch错误: ${error.message}`, 'error');
                addResult(`这是预期的CORS错误，我们继续测试其他方法...`, 'info');
            }

            // 测试JSONP
            addResult('现在尝试JSONP方式...', 'info');
            testJSONPGeocoder();
        }

        function testJSONPGeocoder() {
            const callbackName = 'testCallback_' + Date.now();

            window[callbackName] = function(data) {
                delete window[callbackName];
                if (data.status === 0) {
                    addResult('JSONP请求成功！', 'success', JSON.stringify(data, null, 2));
                } else {
                    addResult(`API返回错误: ${data.message}`, 'error', JSON.stringify(data, null, 2));
                }
            };

            const script = document.createElement('script');
            script.onerror = function() {
                addResult('JSONP脚本加载失败', 'error');
                delete window[callbackName];
            };

            script.src = `https://apis.map.qq.com/ws/geocoder/v1/?location=39.908692,116.397477&key=${API_KEY}&output=jsonp&callback=${callbackName}`;
            document.body.appendChild(script);
        }

        async function testDirectGeocoder() {
            addResult('测试不同的请求格式...', 'info');

            // 尝试不同的参数格式
            const testUrls = [
                `https://apis.map.qq.com/ws/geocoder/v1/?location=39.908692,116.397477&key=${API_KEY}`,
                `https://apis.map.qq.com/ws/geocoder/v1/?lat=39.908692&lng=116.397477&key=${API_KEY}`,
                `https://apis.map.qq.com/ws/geocoder/v1/?location=39.908692,116.397477&key=${API_KEY}&get_poi=0`
            ];

            for (let i = 0; i < testUrls.length; i++) {
                try {
                    addResult(`测试URL ${i + 1}: ${testUrls[i]}`, 'info');
                    const response = await fetch(testUrls[i]);
                    const text = await response.text();
                    addResult(`响应 ${i + 1}: ${response.status} - ${response.statusText}`, response.ok ? 'success' : 'error', text.substring(0, 200) + '...');
                } catch (error) {
                    addResult(`请求 ${i + 1} 失败: ${error.message}`, 'error');
                }
            }
        }

        function testWithDifferentKey() {
            addResult('测试简化版本的API调用...', 'info');

            // 创建一个简化的测试
            const testDiv = document.createElement('div');
            testDiv.innerHTML = `
                <h3>手动测试方法：</h3>
                <p>请在浏览器新标签页中打开以下URL：</p>
                <a href="https://apis.map.qq.com/ws/geocoder/v1/?location=39.908692,116.397477&key=${API_KEY}" target="_blank">
                    https://apis.map.qq.com/ws/geocoder/v1/?location=39.908692,116.397477&key=${API_KEY}
                </a>
                <p>看看能否正常访问API，如果能看到JSON响应，说明API Key是有效的。</p>
            `;
            resultsDiv.appendChild(testDiv);
        }

        // 页面加载时自动开始测试
        window.onload = function() {
            addResult('开始API Key测试...', 'info');
            addResult(`当前使用的API Key: ${API_KEY}`, 'info');
            setTimeout(testAPIKey, 1000);
        };
    </script>
</body>
</html>
