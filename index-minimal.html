<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>车辆位置查询</title>
    <link rel="stylesheet" href="css/style.css">
    <script charset="utf-8" src="https://map.qq.com/api/gljs?v=1.exp&key=67PBZ-AWOWQ-TTW5A-BTI3M-BNMHH-2YBXZ"></script>
</head>
<body>
    <!-- 加载页面 -->
    <div id="loading-page" class="page active">
        <div class="loading-content">
            <div class="car-info">
                <h2 id="car-name">车辆A</h2>
                <p id="car-plate">京A12345</p>
            </div>
            <div class="loading-animation">
                <div class="spinner"></div>
                <p>正在获取位置信息...</p>
            </div>
        </div>
    </div>

    <!-- 地图页面 -->
    <div id="map-page" class="page">
        <div class="map-header">
            <h2 id="location-title">车辆位置</h2>
            <p id="location-coords">坐标加载中...</p>
            <p id="location-accuracy">精度加载中...</p>
            <p id="location-time">时间加载中...</p>
            <div id="location-analysis" class="location-analysis" style="display: none;"></div>
        </div>
        <div id="map-container"></div>
        <div class="action-buttons">
            <button id="refresh-btn" class="btn">
                <span class="icon">🔄</span> 刷新位置
            </button>
            <button id="share-btn" class="btn primary">
                <span class="icon">📤</span> 分享位置
            </button>
        </div>
    </div>

    <!-- 分享页面 -->
    <div id="share-page" class="page">
        <div class="share-content">
            <h2>分享车辆位置</h2>
            <div class="screenshot-container">
                <img id="screenshot-image" src="" alt="位置截图">
                <div class="screenshot-overlay">
                    <button id="save-image-btn" class="btn small">保存图片</button>
                </div>
            </div>
            <div class="share-text">
                <p>📍 <span id="share-coords">坐标信息</span></p>
                <p>🕒 <span id="share-time">更新时间</span></p>
                <p>🚗 <span id="share-car">车辆信息</span></p>
                <p>🔗 <span id="share-link">查看链接</span></p>
                <div id="share-analysis" style="display: none;"></div>
            </div>
            <button id="copy-btn" class="btn">
                <span class="icon">📋</span> 复制位置信息
            </button>
            <div class="share-guide">
                <h3>分享到微信群：</h3>
                <ol>
                    <li>长按上方图片保存到相册</li>
                    <li>打开微信群，选择相册中的图片发送</li>
                    <li>粘贴复制好的位置信息</li>
                    <li>点击链接可在地图中查看</li>
                </ol>
            </div>
        </div>
    </div>

    <!-- 错误提示 -->
    <div id="error-modal" class="modal">
        <div class="modal-content">
            <h3 id="error-title">提示</h3>
            <p id="error-message">错误信息</p>
            <button id="error-ok-btn" class="btn">确定</button>
        </div>
    </div>

    <!-- Toast提示 -->
    <div id="toast" class="toast"></div>

    <!-- 加载脚本 -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/location.js"></script>
    <script>
        // 最小化地图管理器 - 不依赖地址解析
        class MinimalMapManager {
            constructor() {
                this.map = null;
                this.isMapLoaded = false;
            }

            async initializeMap(container, center, zoom = MAP_CONFIG.zoom) {
                return new Promise((resolve, reject) => {
                    if (typeof TMap === 'undefined') {
                        reject(new Error('腾讯地图API未加载'));
                        return;
                    }

                    try {
                        this.map = new TMap.Map(container, {
                            center: new TMap.LatLng(center.lat, center.lng),
                            zoom: zoom
                        });

                        // 延迟确保地图完全加载
                        setTimeout(() => {
                            this.isMapLoaded = true;
                            resolve();
                        }, 1000);

                    } catch (error) {
                        reject(new Error('地图初始化失败: ' + error.message));
                    }
                });
            }

            addMarker(location, carInfo) {
                if (this.map && location) {
                    try {
                        // 尝试添加简单标记
                        if (typeof TMap.Marker === 'function') {
                            const marker = new TMap.Marker({
                                map: this.map,
                                position: new TMap.LatLng(location.lat, location.lng)
                            });
                        } else {
                            // 如果标记不支持，只设置地图中心
                            this.setCenter(location);
                        }
                    } catch (error) {
                        console.warn('标记添加失败，仅设置地图中心:', error);
                        this.setCenter(location);
                    }
                }
            }

            setCenter(location) {
                if (this.map && location) {
                    this.map.setCenter(new TMap.LatLng(location.lat, location.lng));
                }
            }

            // 不再依赖地址解析，直接返回坐标信息
            async getAddressFromLocation(location) {
                if (!location) return '位置未知';

                // 生成可读的坐标格式
                const lat = location.lat.toFixed(6);
                const lng = location.lng.toFixed(6);
                const accuracy = location.accuracy ? Math.round(location.accuracy) : '未知';

                return `坐标: ${lat}, ${lng} (精度: ${accuracy}米)`;
            }

            async generateScreenshot(location, carInfo) {
                if (!location) throw new Error('无法生成截图：位置信息为空');

                const params = new URLSearchParams({
                    center: `${location.lat},${location.lng}`,
                    zoom: MAP_CONFIG.zoom,
                    size: '600x400',
                    maptype: 'roadmap',
                    markers: `size:large|color:red|${location.lat},${location.lng}`,
                    key: MAP_CONFIG.key,
                    format: 'png'
                });

                const url = `https://apis.map.qq.com/ws/staticmap/v2/?${params.toString()}`;
                return url;
            }

            destroy() {
                if (this.map) {
                    this.map.destroy();
                    this.map = null;
                }
                this.isMapLoaded = false;
            }
        }

        // 最小化主应用
        class MinimalVehicleLocationApp {
            constructor() {
                this.currentCar = null;
                this.currentLocation = null;
                this.locationManager = new LocationManager();
                this.mapManager = new MinimalMapManager();
                this.isInitialized = false;
            }

            async init() {
                try {
                    const params = Utils.getUrlParams();
                    const carId = params.car;

                    if (!carId || !VEHICLE_CONFIG[carId]) {
                        throw new Error(ERROR_MESSAGES.INVALID_QRCODE);
                    }

                    this.currentCar = VEHICLE_CONFIG[carId];
                    this.initUI();
                    this.showPage('loading-page');
                    this.bindEvents();
                    await this.startLocationTracking();
                    this.isInitialized = true;

                } catch (error) {
                    this.handleError(error);
                }
            }

            initUI() {
                document.getElementById('car-name').textContent = this.currentCar.name;
                document.getElementById('car-plate').textContent = this.currentCar.plate;
                document.title = `${this.currentCar.name} - ${APP_CONFIG.title}`;
            }

            bindEvents() {
                document.getElementById('refresh-btn').addEventListener('click', () => this.refreshLocation());
                document.getElementById('share-btn').addEventListener('click', () => this.showSharePage());
                document.getElementById('copy-btn').addEventListener('click', () => this.copyLocationInfo());
                document.getElementById('save-image-btn').addEventListener('click', () => this.saveImage());
                document.getElementById('error-ok-btn').addEventListener('click', () => this.hideErrorModal());
            }

            async startLocationTracking() {
                try {
                    const location = await this.locationManager.getCurrentPosition();
                    this.currentLocation = location;
                    await this.initializeMap();
                    this.showMapPage();
                    this.locationManager.watchPosition((newLocation) => this.onLocationUpdate(newLocation));

                } catch (error) {
                    this.handleLocationError(error);
                }
            }

            async initializeMap() {
                const container = document.getElementById('map-container');
                await this.mapManager.initializeMap(container, this.currentLocation);
                await this.updateMapDisplay();
            }

            async updateMapDisplay() {
                if (!this.currentLocation || !this.mapManager.isMapLoaded) return;

                this.mapManager.addMarker(this.currentLocation, this.currentCar);
                this.updateLocationDisplay();
            }

            onLocationUpdate(location) {
                this.currentLocation = location;
                if (this.mapManager.isMapLoaded) {
                    this.updateMapDisplay();
                }
            }

            updateLocationDisplay() {
                if (!this.currentLocation) return;

                const lat = this.currentLocation.lat.toFixed(6);
                const lng = this.currentLocation.lng.toFixed(6);
                const accuracy = this.currentLocation.accuracy ? Math.round(this.currentLocation.accuracy) : '未知';
                const time = Utils.formatTime(new Date(this.currentLocation.timestamp || Date.now()));

                // 更新地图页面信息
                document.getElementById('location-coords').textContent = `坐标: ${lat}, ${lng}`;
                document.getElementById('location-accuracy').textContent = `精度: ${accuracy}米`;
                document.getElementById('location-time').textContent = `时间: ${time}`;

                // 更新分享页面信息
                document.getElementById('share-coords').textContent = `坐标: ${lat}, ${lng}`;
                document.getElementById('share-time').textContent = time;
                document.getElementById('share-car').textContent = `${this.currentCar.name}（${this.currentCar.plate}）`;
                document.getElementById('share-link').textContent = window.location.href;

                // 更新位置分析
                this.updateLocationAnalysis();
            }

            updateLocationAnalysis() {
                if (!this.currentLocation) return;

                const analysis = Utils.analyzeLocation(this.currentLocation, '');
                if (analysis) {
                    const mapAnalysis = document.getElementById('location-analysis');
                    const shareAnalysis = document.getElementById('share-analysis');

                    if (mapAnalysis) {
                        mapAnalysis.textContent = `📊 ${analysis}`;
                        mapAnalysis.style.display = 'block';
                    }

                    if (shareAnalysis) {
                        shareAnalysis.innerHTML = `<p>📊 <strong>位置分析：</strong>${analysis}</p>`;
                        shareAnalysis.style.display = 'block';
                    }
                }
            }

            async refreshLocation() {
                this.showLoadingAnimation();
                try {
                    const location = await this.locationManager.getCurrentPosition({ force: true });
                    this.currentLocation = location;
                    if (this.mapManager.isMapLoaded) {
                        await this.updateMapDisplay();
                    }
                    Utils.showToast('位置已更新');
                } catch (error) {
                    Utils.showToast('刷新失败: ' + error.message);
                } finally {
                    this.hideLoadingAnimation();
                }
            }

            showMapPage() {
                this.showPage('map-page');
                document.getElementById('location-title').textContent = this.currentCar.name;
            }

            async showSharePage() {
                this.showPage('share-page');
                try {
                    const screenshotUrl = await this.mapManager.generateScreenshot(
                        this.currentLocation,
                        this.currentCar
                    );
                    document.getElementById('screenshot-image').src = screenshotUrl;
                } catch (error) {
                    Utils.showToast('截图生成失败: ' + error.message);
                }
            }

            async copyLocationInfo() {
                try {
                    const lat = this.currentLocation.lat.toFixed(6);
                    const lng = this.currentLocation.lng.toFixed(6);
                    const accuracy = this.currentLocation.accuracy ? Math.round(this.currentLocation.accuracy) : '未知';
                    const time = Utils.formatTime();

                    const shareText = `🚗 ${this.currentCar.name}（${this.currentCar.plate}）
📍 坐标: ${lat}, ${lng} (精度: ${accuracy}米)
🕒 更新时间: ${time}
🔗 查看链接: ${window.location.href}`;

                    const success = await Utils.copyToClipboard(shareText);
                    Utils.showToast(success ? '位置信息已复制' : '复制失败，请手动复制');
                } catch (error) {
                    Utils.showToast('复制失败: ' + error.message);
                }
            }

            saveImage() {
                const imageUrl = document.getElementById('screenshot-image').src;
                const link = document.createElement('a');
                link.href = imageUrl;
                link.download = `车辆位置_${Utils.formatTime().replace(/[:\s]/g, '_')}.png`;
                link.click();
                Utils.showToast('图片已保存');
            }

            showPage(pageId) {
                document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
                const targetPage = document.getElementById(pageId);
                if (targetPage) targetPage.classList.add('active');
            }

            showLoadingAnimation() {
                const refreshBtn = document.getElementById('refresh-btn');
                if (refreshBtn) {
                    refreshBtn.disabled = true;
                    refreshBtn.innerHTML = '<span class="icon loading"></span> 定位中...';
                }
            }

            hideLoadingAnimation() {
                const refreshBtn = document.getElementById('refresh-btn');
                if (refreshBtn) {
                    refreshBtn.disabled = false;
                    refreshBtn.innerHTML = '<span class="icon">🔄</span> 刷新位置';
                }
            }

            handleError(error) {
                console.error('应用错误:', error);
                this.showErrorModal(error.message || '发生未知错误');
            }

            handleLocationError(error) {
                console.error('定位错误:', error);
                let message = error.message;
                if (error.message.includes('位置') || error.message.includes('定位')) {
                    message = error.message + '\n\n请确保：\n1. 已开启定位服务\n2. 允许浏览器获取位置\n3. 在室外或靠近窗户';
                }
                this.showErrorModal(message);
            }

            showErrorModal(message) {
                document.getElementById('error-title').textContent = '提示';
                document.getElementById('error-message').textContent = message;
                document.getElementById('error-modal').classList.add('active');
            }

            hideErrorModal() {
                document.getElementById('error-modal').classList.remove('active');
            }
        }

        // 应用初始化
        document.addEventListener('DOMContentLoaded', async () => {
            window.app = new MinimalVehicleLocationApp();
            try {
                await window.app.init();
            } catch (error) {
                console.error('应用初始化失败:', error);
            }
        });
    </script>
</body>
</html>
